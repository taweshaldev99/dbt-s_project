# Project names can only contain lowercase letters and underscores.
name: 'dbt_project'
version: '1.0.0'

# Must match the profile name in profiles.yml
profile: 'dbt_project'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  dbt_project:
    # Silver layer: cleaned views (the two incremental models override this)
    staging:
      +materialized: view
      +schema: silver
    # Gold layer: reporting tables
    marts:
      +materialized: table
      +schema: gold

seeds:
  dbt_project:
    +schema: silver